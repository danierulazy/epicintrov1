name: EpicIntro
version: 1.0.0
main: id.laper.epicintro.EpicIntroPlugin
api-version: 1.13
description: Intro sinematik per-member (skin + nama + musik + animasi)
commands:
  epicintro:
    description: Perintah utama EpicIntro
    aliases: [intro]
    permission: epicintro.admin
permissions:
  epicintro.admin:
    default: op
  epicintro.skip:
    description: Tidak ikut jadi penonton (kamera) saat intro diputar
    default: false
